  - name: stg_involved_companies
    description: >-
      One row per IGDB involved-company relationship record, keyed by raw igdb_id
      as involved_company_id, not by game, company, or their pair. Distinct records
      sharing a game/company pair remain distinct. This view projects
      raw_involved_companies without joins, filters, deduplication, or expansion.
      Optional scalars retain SQL NULL for missing keys or JSON null; malformed
      non-null scalars fail when read. Independent bounded ingestion does not
      guarantee referenced games or companies, so relationship tests are deferred.
    columns:
      - name: involved_company_id
        description: >-
          Non-null BIGINT relationship record identifier from raw_involved_companies.igdb_id;
          unique row key, not a game ID or company ID.
        data_tests: [unique, not_null]
      - name: game_id
        description: >-
          Nullable BIGINT cast of payload.game, referencing stg_games.game_id.
          Missing keys and JSON null become SQL NULL; zero is preserved. Repeated
          and unmatched references are valid. Relationship tests are deferred
          because independently bounded game loads may omit referenced rows.
      - name: company_id
        description: >-
          Nullable BIGINT cast of payload.company, referencing stg_companies.company_id.
          Missing keys and JSON null become SQL NULL; zero is preserved. Repeated
          and unmatched references are valid. Relationship tests are deferred
          because independently bounded company loads may omit referenced rows.
      - name: developer
        description: >-
          Nullable BOOLEAN cast of payload.developer. Missing keys and JSON null
          become SQL NULL (unknown), with no inferred default; false stays false.
          Independent of publisher: both roles may be true, false, or unknown.
      - name: publisher
        description: >-
          Nullable BOOLEAN cast of payload.publisher. Missing keys and JSON null
          become SQL NULL (unknown), with no inferred default; false stays false.
          Independent of developer: both roles may be true, false, or unknown.
      - name: source_updated_at
        description: >-
          Nullable TIMESTAMPTZ instant converted from payload.updated_at Unix seconds.
          Missing keys and JSON null become SQL NULL; zero and negative epochs are
          preserved. Source update time, not the load time or ingestion watermark.
      - name: fetched_at
        description: >-
          Non-null TIMESTAMPTZ loader timestamp passed through from
          raw_involved_companies.fetched_at for this stored version;
          not the source update time or ingestion watermark.
