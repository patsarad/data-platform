  - name: stg_companies
    description: >-
      One row per IGDB company, keyed by the raw igdb_id as company_id. This view
      projects raw_companies without joins, filters, deduplication, or relationship
      expansion. Nullable raw values remain unchanged; malformed non-null
      source timestamps fail when read. Bounded ingestion need not load every company.
    columns:
      - name: company_id
        description: Non-null BIGINT IGDB company identifier from raw_companies.igdb_id; unique row key.
        data_tests: [unique, not_null]
      - name: name
        description: Nullable TEXT company name passed through from raw_companies.name, including empty strings.
      - name: slug
        description: Nullable TEXT company slug passed through from raw_companies.slug, including empty strings.
      - name: source_updated_at
        description: >-
          Nullable TIMESTAMPTZ instant converted from payload.updated_at Unix seconds.
          Missing keys and JSON null become SQL NULL; zero and negative epochs are
